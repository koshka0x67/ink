<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ink Display</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

    <div class="app-container">
        <header>
            <h1>Ink Display</h1>
            <div class="subtitle">Waveshare 2.13" e-Paper</div>
        </header>

        <main>
            <!-- Visual Editor Stage -->
            <div class="editor-stage">
                <div class="canvas-wrapper" style="position:relative; width:100%;">
                    <div class="canvas-container">
                        <canvas id="editorCanvas"></canvas>
                        <div class="overlay-guide"></div>

                        <!-- Upload overlay prompt -->
                        <div id="uploadPrompt" class="upload-prompt">
                            <div class="icon-large">📷</div>
                            <span>Tap to Upload Image</span>
                            <div class="instructions">Supports JPG, PNG, GIF</div>
                        </div>
                    </div>
                </div>

                <div class="controls-row">
                    <button class="btn" onclick="rotate90()">
                        <span class="btn-icon">↺</span> Rotate
                    </button>
                    <button id="btnUpload" class="btn btn-primary" onclick="uploadImage()">
                        <span>🚀</span> Update Display
                    </button>
                </div>

                <div class="instructions" style="margin-top:20px">
                    Drag to Pan • Pinch to Zoom • 2 Fingers to Rotate (Coming Soon)
                </div>
            </div>

            <!-- Utility Actions -->
            <h3 style="margin:20px 0 10px 0; font-size:14px; color:#a3a3a3;">Quick Actions</h3>
            <div class="actions-grid">
                <div class="action-card" onclick="clearDisplay()">
                    <span>🗑️</span>
                    <h3>Clear Screen</h3>
                </div>
                <div class="action-card" onclick="location.reload()">
                    <span>🔄</span>
                    <h3>Reload App</h3>
                </div>
            </div>

        </main>

        <div id="statusBar" class="status-bar">Ready</div>

        <!-- Hidden Input -->
        <input type="file" id="fileInput" accept="image/*">
    </div>

    <script src="/static/js/app.js"></script>
</body>

</html>
